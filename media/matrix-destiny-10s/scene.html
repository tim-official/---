<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data:">
  <title>Матрица судьбы — 10 секунд</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; background: #060808; }
    body { min-height: 100vh; display: grid; place-content: center; gap: 14px; }
    canvas { display: block; width: min(90vw, 45vh); height: auto; }
    button { border: 1px solid #6c5736; color: #ead7b0; background: #101211; padding: 10px 18px; cursor: pointer; }
    button:focus-visible { outline: 2px solid #ead7b0; outline-offset: 4px; }
    body.render { display: block; width: 1080px; height: 1920px; overflow: hidden; }
    body.render canvas { width: 1080px; height: 1920px; }
    body.render button { display: none; }
  </style>
  <script src="scene.js" defer></script>
</head>
<body>
  <canvas width="1080" height="1920" role="img"
    aria-label="Матрица судьбы. Золотые числа собираются в светящуюся символическую матрицу. Твоя дата. Твой путь. Открой себя с новой стороны."></canvas>
  <button type="button" aria-pressed="false">Пауза</button>
</body>
</html>
