<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Телесуфлер</title>
<style>
  :root { --bg:#111; --fg:#fff; --muted:#8a8a8a; --accent:#4da3ff; --panel:#1b1b1b; --line:#2a2a2a; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family: "Segoe UI", Inter, Arial, Helvetica, sans-serif; overflow:hidden; }
  #viewport { position:fixed; inset:0; overflow:hidden; }
  #scroller { height:100%; overflow-y:scroll; scrollbar-width:none; }
  #scroller::-webkit-scrollbar { display:none; }
  #text { max-width:500px; margin:0 auto; padding:14px 16px 100vh;
    font-size:32px; line-height:1.35; font-weight:500; white-space:pre-wrap; word-wrap:break-word; }
  #text.mirror { transform:scaleX(-1); }
  /* верхняя граница чтения: глаза у верхнего края экрана, рядом с объективом */
  #fade { position:fixed; left:0; right:0; bottom:0; height:35%; pointer-events:none;
    background:linear-gradient(transparent, var(--bg)); }
  #hud { position:fixed; right:6px; bottom:6px; display:flex; gap:4px; align-items:center;
    font-size:12px; color:var(--muted); opacity:.25; transition:opacity .2s; }
  body:hover #hud, #hud:focus-within { opacity:1; }
  #hud button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:3px 8px; font:inherit; cursor:pointer; }
  #hud button:hover { border-color:var(--accent); }
  #status { padding:0 4px; white-space:nowrap; }
  #toast { position:fixed; top:6px; left:50%; transform:translateX(-50%); background:var(--panel);
    border:1px solid var(--line); border-radius:6px; padding:3px 10px; font-size:13px;
    color:var(--fg); opacity:0; transition:opacity .25s; pointer-events:none; }
  #toast.show { opacity:1; }
  #editor { position:fixed; inset:0; background:var(--bg); display:none; flex-direction:column; padding:8px; gap:6px; }
  #editor.open { display:flex; }
  #editor textarea { flex:1; width:100%; resize:none; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:6px; padding:8px; font-family:inherit; font-size:15px; line-height:1.4; }
  #editor textarea:focus { outline:1px solid var(--accent); }
  #editor .row { display:flex; gap:6px; justify-content:flex-end; font-size:12px; color:var(--muted); align-items:center; }
  #editor .row span { margin-right:auto; }
  #editor button { background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:4px 12px; font:inherit; font-size:13px; cursor:pointer; }
  #editor button.primary { background:var(--accent); border-color:var(--accent); color:#000; }
</style>
</head>
<body>
<div id="viewport"><div id="scroller"><div id="text"></div></div></div>
<div id="fade"></div>
<div id="toast"></div>
<div id="hud">
  <span id="status"></span>
  <button id="btnPlay" title="Пробел">▶</button>
  <button id="btnEdit" title="E — вставить / редактировать текст">✎ Текст</button>
  <button id="btnHelp" title="Подсказка по клавишам">?</button>
</div>
<div id="editor">
  <textarea id="input" placeholder="Вставьте сюда свой текст (Ctrl+V)…"></textarea>
  <div class="row">
    <span>Ctrl+Enter — сохранить, Esc — отмена</span>
    <button id="btnCancel">Отмена</button>
    <button id="btnSave" class="primary">Сохранить</button>
  </div>
</div>
<script>
(() => {
  const DEFAULT_TEXT = "Добро пожаловать в телесуфлер.\n\nНажмите «✎ Текст» или клавишу E, чтобы вставить свой текст.\n\nПробел — старт / пауза.\nСтрелки ↑ / ↓ — скорость.\n+ / − — размер шрифта.\nHome — в начало, M — зеркало.\n\nСмотрите в объектив: строки, которые вы читаете, всегда у верхнего края окна, прямо под камерой.";
  const $ = id => document.getElementById(id);
  const scroller = $("scroller"), text = $("text"), status = $("status"), toast = $("toast");
  const editor = $("editor"), input = $("input");

  const store = {
    get(k, d) { try { const v = localStorage.getItem("tp_" + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("tp_" + k, JSON.stringify(v)); } catch {} }
  };

  let state = {
    text: store.get("text", DEFAULT_TEXT),
    speed: store.get("speed", 40),     // пикселей в секунду
    font: store.get("font", 32),
    mirror: store.get("mirror", false),
    pos: store.get("pos", 0)
  };
  let playing = false, last = 0, acc = 0, toastTimer = 0;

  function render() {
    text.textContent = state.text;
    text.style.fontSize = state.font + "px";
    text.classList.toggle("mirror", state.mirror);
    updateStatus();
  }
  function updateStatus() {
    status.textContent = `${playing ? "▶" : "❚❚"} скорость ${state.speed} · шрифт ${state.font}px`;
    $("btnPlay").textContent = playing ? "❚❚" : "▶";
  }
  function flash(msg) {
    toast.textContent = msg; toast.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove("show"), 900);
  }
  function save() { ["text","speed","font","mirror"].forEach(k => store.set(k, state[k])); }

  function tick(t) {
    if (!playing) return;
    const dt = last ? (t - last) / 1000 : 0; last = t;
    acc += state.speed * dt;
    if (acc >= 1) { const px = Math.floor(acc); acc -= px; scroller.scrollTop += px; }
    if (scroller.scrollTop + scroller.clientHeight >= scroller.scrollHeight - 1) { toggle(false); flash("Конец текста"); }
    requestAnimationFrame(tick);
  }
  function toggle(force) {
    playing = typeof force === "boolean" ? force : !playing;
    last = 0; acc = 0;
    if (playing) requestAnimationFrame(tick);
    updateStatus();
    if (!playing) store.set("pos", scroller.scrollTop);
  }
  function setSpeed(d) { state.speed = Math.max(0, Math.min(400, state.speed + d)); save(); updateStatus(); flash("Скорость: " + state.speed); }
  function setFont(d) {
    const ratio = scroller.scrollTop / Math.max(1, scroller.scrollHeight);
    state.font = Math.max(14, Math.min(96, state.font + d)); save(); render();
    scroller.scrollTop = ratio * scroller.scrollHeight; flash("Шрифт: " + state.font + "px");
  }
  function openEditor() { toggle(false); input.value = state.text; editor.classList.add("open"); input.focus(); }
  function closeEditor(commit) {
    if (commit) { state.text = input.value.trim() || DEFAULT_TEXT; save(); render(); scroller.scrollTop = 0; store.set("pos", 0); flash("Текст сохранён"); }
    editor.classList.remove("open");
  }

  document.addEventListener("keydown", e => {
    if (editor.classList.contains("open")) {
      if (e.key === "Escape") { e.preventDefault(); closeEditor(false); }
      else if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); closeEditor(true); }
      return;
    }
    switch (e.key) {
      case " ": case "Spacebar": e.preventDefault(); toggle(); break;
      case "ArrowUp": e.preventDefault(); setSpeed(e.shiftKey ? 20 : 5); break;
      case "ArrowDown": e.preventDefault(); setSpeed(e.shiftKey ? -20 : -5); break;
      case "+": case "=": e.preventDefault(); setFont(2); break;
      case "-": case "_": e.preventDefault(); setFont(-2); break;
      case "Home": e.preventDefault(); scroller.scrollTop = 0; store.set("pos", 0); break;
      case "PageDown": e.preventDefault(); scroller.scrollTop += scroller.clientHeight * 0.8; break;
      case "PageUp": e.preventDefault(); scroller.scrollTop -= scroller.clientHeight * 0.8; break;
      case "e": case "E": case "у": case "У": e.preventDefault(); openEditor(); break;
      case "m": case "M": case "ь": case "Ь": state.mirror = !state.mirror; save(); render(); break;
    }
    if (e.code === "NumpadAdd") { e.preventDefault(); setFont(2); }
    if (e.code === "NumpadSubtract") { e.preventDefault(); setFont(-2); }
  });

  // колесо мыши — ручная прокрутка (работает и во время воспроизведения)
  $("btnPlay").onclick = () => toggle();
  $("btnEdit").onclick = openEditor;
  $("btnHelp").onclick = () => flash("Пробел · ↑↓ скорость · +/− шрифт · E текст · M зеркало · Home");
  $("btnSave").onclick = () => closeEditor(true);
  $("btnCancel").onclick = () => closeEditor(false);
  text.ondblclick = openEditor;
  window.addEventListener("beforeunload", () => store.set("pos", scroller.scrollTop));

  render();
  scroller.scrollTop = state.pos;
  // кнопки не должны перехватывать пробел после клика
  document.querySelectorAll("#hud button").forEach(b => b.addEventListener("mouseup", () => b.blur()));
})();
</script>
</body>
</html>
